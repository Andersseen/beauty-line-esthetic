<!doctype html>
<html lang="es" data-style="soft">
  <head>
    <meta charset="utf-8" />
    <title>Beauty Line</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d86674" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#872a3f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Apply the saved theme before first paint (no flash); the switch in the header writes it. */
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Geist is self-hosted (public/fonts, variable: every weight in one file); the Latin file is
         fetched in parallel with the CSS so it is usually ready for first paint. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-latin-wght-normal.woff2" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
